[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "deepiri-ollama"
version = "0.1.0"
description = "Shared Ollama client and runtime helpers"
requires-python = ">=3.9"
dependencies = [
  "httpx>=0.27",
]

[project.scripts]
deepiri-ollama = "deepiri_ollama.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]