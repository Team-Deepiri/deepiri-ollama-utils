[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "deepiri-ollama-utils"
version = "0.2.0"
description = "Shared Ollama client, model management, and runtime helpers"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27",
  "deepiri-gpu-utils @ git+https://github.com/Team-Deepiri/deepiri-gpu-utils.git@d1f8e92d5ec38f9a839ac9bade04cd71edd219b1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
]

[project.scripts]
deepiri-ollama-utils = "deepiri_ollama.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
