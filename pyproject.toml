[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "deepiri-ollama-utils"
version = "0.1.0"
description = "Shared Ollama client, model management, and runtime helpers"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27",
  "deepiri-gpu-utils @ git+https://github.com/Team-Deepiri/deepiri-gpu-utils.git@40ec33fccfa5db55be4fdd13f2bd9763e529b221",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
]

[project.scripts]
deepiri-ollama-utils = "deepiri_ollama.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
